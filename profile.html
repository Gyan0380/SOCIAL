<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - Setup</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <video autoplay loop muted id="profile-bg-video" class="bg-video-blur">
        <source src="anime-video.mp4" type="video/mp4">
    </video>

    <div class="container">
        <div class="glass-box" style="max-height: 90vh; overflow-y: auto;">
            <h2>Account Setup</h2>

            <img id="preview-img" src="default-profile.png" class="center-profile" style="width: 100px; height: 100px;">
            <input type="file" id="profile-upload" accept="image/*">
            <input type="text" id="username" placeholder="Choose unique username">
            <input type="text" id="fullname" placeholder="Full Name">
            <input type="text" id="bio" placeholder="Bio">
            
            <hr style="margin: 20px 0; border-color: rgba(255,255,255,0.2);">
            
            <!-- Main Play Music Section -->
            <h3 style="font-size: 14px; margin-bottom: 5px; text-align: left;">🎵 Main Play Music Link</h3>
            <input type="text" id="main-music-link" placeholder="Spotify / YouTube Song Link for Play Button">

            <!-- Playlists Section -->
            <h3 style="font-size: 14px; margin: 15px 0 5px 0; text-align: left;">📑 Playlists (Max 3)</h3>
            <input type="text" id="music-1" placeholder="Playlist 1 Link">
            <input type="text" id="music-2" placeholder="Playlist 2 Link (Optional)">
            <input type="text" id="music-3" placeholder="Playlist 3 Link (Optional)">

            <!-- Social Handles -->
            <h3 style="font-size: 14px; margin: 15px 0 5px 0; text-align: left;">🌐 Social Handles</h3>
            <input type="text" id="ig-link" placeholder="Instagram Username">
            <input type="text" id="yt-link" placeholder="YouTube Channel Link">
            
            <button id="save-profile-btn" style="margin-top: 20px;">Save Profile</button>
            <button onclick="window.location.href='index.html'" style="background: #555;">Back to Home</button>
        </div>
    </div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
