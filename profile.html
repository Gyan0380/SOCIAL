<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background Video -->
    <video autoplay loop muted class="bg-video">
        <source src="your-video-link.mp4" type="video/mp4">
    </video>

    <div class="container">
        <div class="glass-box" style="width: 400px; max-height: 90vh; overflow-y: auto;">
            <h2>Account Setup / Edit</h2>
            
            <!-- Notifications Section -->
            <div id="notifications-box" style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 12px; display: none;">
                <strong>Notifications:</strong>
                <ul id="noti-list" style="list-style: none; padding-top: 5px; text-align: left;"></ul>
            </div>

            <div id="profile-form">
                <!-- Profile Picture Upload -->
                <img id="preview-img" src="default-profile.png" class="center-profile" style="width: 100px; height: 100px;">
                <input type="file" id="profile-upload" accept="image/*">
                
                <input type="text" id="username" placeholder="Choose unique username (e.g. gyan123)" required>
                <input type="text" id="fullname" placeholder="Full Name">
                <input type="text" id="bio" placeholder="Bio">
                
                <hr style="margin: 15px 0; border-color: rgba(255,255,255,0.2);">
                <p style="font-size: 14px;">Social Links & Music</p>
                <input type="text" id="ig-link" placeholder="Instagram URL">
                <input type="text" id="fb-link" placeholder="Facebook URL">
                <input type="text" id="yt-link" placeholder="YouTube/Spotify Song Link">
                
                <button id="save-profile-btn">Save Profile</button>
                <button onclick="window.location.href='index.html'" style="background: #555;">Back to Home</button>
            </div>
        </div>
    </div>

    <div class="creator-watermark">web created by GYAN GUPTA</div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
