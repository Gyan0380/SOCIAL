<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Gyan Social</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Login Overlay -->
    <div id="login-overlay" class="glass-box" style="width: 300px; margin: 100px auto; text-align: center;">
        <h3>🔒 Admin Login</h3>
        <input type="password" id="admin-pass" placeholder="Enter Admin Password">
        <button id="login-btn" style="background: #1db954;">Access Panel</button>
    </div>

    <!-- Admin Panel (Initially Hidden) -->
    <div id="admin-panel" class="glass-box" style="display: none; width: 90%; max-width: 500px; margin: 20px auto;">
        <h3>⚙️ Admin Dashboard</h3>
        <button onclick="window.location.href='index.html'" style="background:#555; font-size:10px;">Back to Site</button>
        
        <div style="margin-top: 20px;">
            <h4>Add Store Offer</h4>
            <input type="text" id="offer-name" placeholder="Offer Name (e.g. Premium Access)">
            <input type="text" id="offer-desc" placeholder="Offer Description">
            <input type="number" id="offer-price" placeholder="Price (Coins)">
            <input type="text" id="offer-coupon" placeholder="Hidden Coupon Code">
            <button id="add-item-btn" style="background: #e67e22;">Add to Store</button>
        </div>
        
        <div style="margin-top: 30px;">
            <h4>Manage Store</h4>
            <div id="active-items-list"></div>
        </div>
    </div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
