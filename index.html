<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Gyan - Social Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <video autoplay loop muted id="main-bg-video" class="bg-video">
        <source src="anime-video.mp4" type="video/mp4">
    </video>

    <!-- Top Corner Nav (Only for logged-in user) -->
    <div class="top-nav" id="top-nav" style="display: none;">
        <button id="share-profile-btn" style="background: #1e90ff; padding: 6px 12px; font-size: 12px; border-radius: 20px; width: auto;">📤 Share Profile</button>
        
        <div id="corner-profile" style="position: relative;">
            <img id="corner-img" src="default-profile.png" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; cursor: pointer; object-fit: cover;">
            
            <div id="dropdown-menu" style="display: none; position: absolute; top: 50px; right: 0; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 8px; width: 140px; border: 1px solid rgba(255,255,255,0.2);">
                <button onclick="window.location.href='profile.html'" style="padding: 6px; font-size: 12px; margin-bottom: 5px;">✏️ Edit Profile</button>
                <button onclick="window.location.href='admin.html'" style="background: #f39c12; padding: 6px; font-size: 12px; margin-bottom: 5px;">⚙️ Admin</button>
                <button id="logout-btn" style="background: #ff4757; padding: 6px; font-size: 12px;">🚪 Logout</button>
            </div>
        </div>
    </div>

    <button id="sound-toggle" class="sound-toggle-btn">🔇 Sound OFF</button>

    <div class="container">
        <!-- Auth Section -->
        <div id="auth-section" class="glass-box">
            <h2 id="form-title">Sign In</h2>
            <input type="email" id="email" placeholder="Enter Email" required>
            <input type="password" id="password" placeholder="Enter Password" required>
            <button id="auth-btn">Sign In</button>
            <p style="margin-top:15px; font-size:14px;">
                Don't have an account? <br>
                <span id="toggle-link" style="color:#4da3ff; cursor:pointer; font-weight:bold;">Create New Account</span>
            </p>
        </div>

        <!-- Main Screen / Public View Screen -->
        <div id="main-screen" style="display: none; width: 100%; max-width: 400px; text-align: center;">
            
            <!-- Profile DP & Name -->
            <div style="margin-bottom: 20px;">
                <img id="main-profile-img" src="default-profile.png" style="width: 130px; height: 130px; border-radius: 50%; border: 3px solid white; object-fit: cover; box-shadow: 0 0 20px rgba(0,0,0,0.6);">
                <h2 id="main-username" style="margin-top: 15px; text-shadow: 2px 2px 5px black;">@username</h2>
                <p id="main-bio" style="font-size: 13px; color: #ddd; margin-top: 5px;"></p>
            </div>

            <!-- Music Player Container -->
            <div class="music-container" id="music-box-ui">
                <button id="play-pause-btn" class="play-pause-btn">▶</button>
                <div class="song-info-box">
                    <div class="song-name-text" id="display-song-name">No song added</div>
                    <div class="waveform-progress">
                        <div class="waveform-fill" id="music-progress"></div>
                    </div>
                </div>
            </div>

            <!-- Spotify Direct Redirect Button (Appears only if Spotify link is present) -->
            <div id="spotify-redirect-container" style="margin-top: 10px; display: none;">
                <a id="spotify-direct-link" href="#" target="_blank" style="display: block; background: #1db954; color: white; padding: 10px; border-radius: 20px; font-size: 13px; font-weight: bold; text-decoration: none;">
                    🟢 Play full song on Spotify
                </a>
            </div>

            <!-- Hidden Audio/Embed Container -->
            <div id="embedded-player-container"></div>

            <!-- Social Media Buttons (Auto generated if added) -->
            <div id="social-buttons-container" style="margin-top: 20px; display: flex; justify-content: center; gap: 10px;"></div>

            <!-- Back to my profile button (Visible when viewing someone else) -->
            <div id="back-my-profile" style="margin-top: 25px; display: none;">
                <button onclick="window.location.href='index.html'" style="background: #333; font-size: 12px; width: auto; padding: 8px 20px; border-radius: 20px;">🏠 View My Profile</button>
            </div>
        </div>
    </div>

    <div class="creator-watermark">web created by GYAN GUPTA</div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
