<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Gyan - Social Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Tic Tac Toe Grid Style */
        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; max-width: 250px; margin: 15px auto; }
        .ttt-cell { background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.2); height: 75px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .ttt-cell:hover { background: rgba(255,255,255,0.1); }
        .ttt-cell.x { color: #ff4757; }
        .ttt-cell.o { color: #1e90ff; }
    </style>
</head>
<body>
    <video autoplay loop muted id="main-bg-video" class="bg-video">
        <source src="anime-video.mp4" type="video/mp4">
    </video>

    <!-- Top Corner Nav -->
    <div class="top-nav" id="top-nav" style="display: none;">
        <button id="share-profile-btn" style="background: #1e90ff; padding: 6px 12px; font-size: 12px; border-radius: 20px; width: auto;">📤 Share</button>
        
        <div id="corner-profile" style="position: relative;">
            <img id="corner-img" src="default-profile.png" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; cursor: pointer; object-fit: cover;">
            
            <div id="dropdown-menu" style="display: none; position: absolute; top: 50px; right: 0; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 8px; width: 150px; border: 1px solid rgba(255,255,255,0.2);">
                <div style="font-size: 12px; color: #ffd700; text-align: center; margin-bottom: 8px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px;">🪙 <span id="nav-coins-display">0</span> Coins</div>
                <button onclick="window.location.href='profile.html'" style="padding: 6px; font-size: 12px; margin-bottom: 5px;">✏️ Edit Profile</button>
                <button id="open-friends-menu" style="background: #1e90ff; padding: 6px; font-size: 12px; margin-bottom: 5px;">👥 Friends Menu</button>
                <button id="nav-open-games" style="background: #9b59b6; padding: 6px; font-size: 12px; margin-bottom: 5px;">🎮 Games</button>
                <button onclick="window.location.href='admin.html'" style="background: #f39c12; padding: 6px; font-size: 12px; margin-bottom: 5px;">⚙️ Admin</button>
                <button id="logout-btn" style="background: #ff4757; padding: 6px; font-size: 12px;">🚪 Logout</button>
            </div>
        </div>
    </div>

    <button id="sound-toggle" class="sound-toggle-btn">🔇 Sound OFF</button>

    <div class="container">
        <!-- Auth Section -->
        <div id="auth-section" class="glass-box">
            <h2 id="form-title">Sign In</h2>
            <input type="email" id="email" placeholder="Enter Email" required>
            <input type="password" id="password" placeholder="Enter Password" required>
            <button id="auth-btn">Sign In</button>
            <p style="margin-top:15px; font-size:14px;">
                Don't have an account? <br>
                <span id="toggle-link" style="color:#4da3ff; cursor:pointer; font-weight:bold;">Create New Account</span>
            </p>
        </div>

        <!-- Friends Modal (Hidden for brevity) -->
        <div id="friends-modal" class="glass-box" style="display: none; position: absolute; top: 70px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; z-index: 50; text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; margin-bottom: 10px;">
                <h3 style="font-size: 15px; margin:0;">👥 Friends & Chat</h3>
                <button id="close-friends-modal" style="width: auto; padding: 2px 8px; background: #ff4757; font-size: 11px; margin:0;">X</button>
            </div>
            <!-- ... (Keep your existing friends modal content here) ... -->
            <button id="close-chat-box" style="display:none;"></button>
        </div>

        <!-- ======================================= -->
        <!-- 1. GAMES HUB MODAL (MAIN MENU) -->
        <!-- ======================================= -->
        <div id="games-hub-modal" class="glass-box" style="display: none; position: absolute; top: 70px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; z-index: 60; text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; margin-bottom: 10px;">
                <h3 style="font-size: 15px; margin:0;">🎮 Games Center</h3>
                <button id="close-games-hub" style="width: auto; padding: 2px 8px; background: #ff4757; font-size: 11px; margin:0;">X</button>
            </div>
            
            <div style="text-align: center; margin-bottom: 10px; font-size: 14px; font-weight: bold; color: #ffd700;">
                Your Balance: <span id="hub-coins-display">0</span> 🪙
            </div>
            
            <div style="display: flex; gap: 5px; margin-bottom: 15px;">
                <button id="tab-play-games" style="padding: 8px; font-size: 12px; margin:0; background:#9b59b6;">Play Games</button>
                <button id="tab-leaderboard" style="padding: 8px; font-size: 12px; margin:0; background:#555;">🏆 Global Leaderboard</button>
            </div>
            
            <div id="sec-play-games" style="display: block;">
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Multiplayer O X Button -->
                    <button id="btn-open-tic-tac-toe" style="background: rgba(255, 71, 87, 0.2); border: 1px solid #ff4757; padding: 10px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-align: left;">
                        <span style="font-size: 24px;">❌⭕</span> 
                        <div style="flex-grow: 1;">
                            <div style="font-size: 14px; font-weight: bold; color: #ff4757;">Multiplayer O X (Bet Coins)</div>
                            <div style="font-size: 10px; color: #ddd; font-weight: normal; line-height: 1.2;">Play with Friends or Random!</div>
                        </div>
                    </button>

                    <!-- Code Guess Button -->
                    <button id="btn-open-code-guess" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); padding: 10px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-align: left;">
                        <span style="font-size: 24px;">🧠</span> 
                        <div style="flex-grow: 1;">
                            <div style="font-size: 14px; font-weight: bold; color: #1db954;">Code Guess</div>
                            <div style="font-size: 10px; color: #ddd; font-weight: normal;">Earn Free Coins!</div>
                        </div>
                    </button>
                    
                    <!-- Memory Match Button -->
                    <button id="btn-open-memory-match" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); padding: 10px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-align: left;">
                        <span style="font-size: 24px;">🃏</span> 
                        <div style="flex-grow: 1;">
                            <div style="font-size: 14px; font-weight: bold; color: #ffeb3b;">Memory Match</div>
                            <div style="font-size: 10px; color: #ddd; font-weight: normal;">Earn Free Coins!</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- GLOBAL LEADERBOARD -->
            <div id="sec-leaderboard" style="display: none;">
                <div style="font-size: 13px; color: #ffd700; text-align: center; margin-bottom: 10px; font-weight: bold;">🌍 Top Richest Players (Coins)</div>
                <div id="leaderboard-list" style="display: flex; flex-direction: column; gap: 8px; min-height: 150px;"></div>
            </div>
        </div>

        <!-- ======================================= -->
        <!-- 4. TIC-TAC-TOE (O X) MULTIPLAYER MODAL -->
        <!-- ======================================= -->
        <div id="tic-tac-toe-modal" class="glass-box" style="display: none; position: absolute; top: 70px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; z-index: 62; text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; margin-bottom: 10px;">
                <h3 style="font-size: 15px; margin:0;">❌⭕ Multiplayer O X</h3>
                <button id="back-to-hub-ttt" style="width: auto; padding: 2px 8px; background: #555; font-size: 11px; margin:0;">Back</button>
            </div>

            <!-- SETUP SCREEN -->
            <div id="ttt-setup">
                <div style="text-align: center; margin-bottom: 15px; font-size: 13px;">
                    Balance: <strong style="color: #ffd700;"><span id="ttt-balance">0</span> 🪙</strong>
                </div>
                
                <label style="font-size: 11px; color:#aaa; margin-bottom: 5px; display: block;">Bet Amount (Enter 0 for Free Play):</label>
                <input type="number" id="ttt-bet-amount" placeholder="e.g. 10" value="0" min="0" style="width: 100%; margin-bottom: 15px;">

                <button id="ttt-random-btn" style="background: #e67e22; font-size: 13px; font-weight: bold;">🔍 Play Random (Auto-Bot after 5s)</button>
                
                <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">
                
                <div style="display: flex; gap: 10px;">
                    <button id="ttt-create-btn" style="background: #1db954; font-size: 11px;">🤝 Create Friend Room</button>
                    <button id="ttt-join-btn" style="background: #3498db; font-size: 11px;">🔑 Join Room</button>
                </div>
            </div>

            <!-- MATCHMAKING SCREEN -->
            <div id="ttt-matchmaking" style="display: none; text-align: center; padding: 20px 0;">
                <h3 id="ttt-mm-status" style="color: #1e90ff; font-size: 16px;">Searching for player...</h3>
                <p id="ttt-room-code-display" style="font-size: 12px; margin-top: 10px; color: #aaa;"></p>
                <button id="ttt-cancel-mm-btn" style="background: #ff4757; font-size: 11px; width: auto; padding: 5px 15px; margin-top: 15px;">Cancel</button>
            </div>

            <!-- GAME SCREEN -->
            <div id="ttt-game-area" style="display: none; text-align: center;">
                <div style="display: flex; justify-content: space-between; font-size: 12px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <div style="color: #ff4757; font-weight: bold;">❌ <span id="ttt-player-x">Player 1</span></div>
                    <div style="color: #ffd700; font-weight: bold;">Bet: <span id="ttt-current-bet">0</span> 🪙</div>
                    <div style="color: #1e90ff; font-weight: bold;">⭕ <span id="ttt-player-o">Player 2</span></div>
                </div>

                <h3 id="ttt-turn-display" style="color: white; font-size: 16px; margin: 10px 0;">Wait...</h3>

                <div class="ttt-grid" id="ttt-grid">
                    <div class="ttt-cell" data-index="0"></div><div class="ttt-cell" data-index="1"></div><div class="ttt-cell" data-index="2"></div>
                    <div class="ttt-cell" data-index="3"></div><div class="ttt-cell" data-index="4"></div><div class="ttt-cell" data-index="5"></div>
                    <div class="ttt-cell" data-index="6"></div><div class="ttt-cell" data-index="7"></div><div class="ttt-cell" data-index="8"></div>
                </div>

                <button id="ttt-leave-game-btn" style="background: #ff4757; font-size: 11px; width: auto; padding: 5px 15px; margin-top: 10px;">Forfeit / Leave Game</button>
            </div>
        </div>

        <!-- OLD GAMES MODALS (Hidden for brevity, keep your Code Guess & Memory Match Modals here) -->
        <div id="code-guess-modal" class="glass-box" style="display: none; position: absolute; top: 70px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; z-index: 61;">
             <!-- (Paste your existing code guess html here) -->
        </div>
        <div id="memory-match-modal" class="glass-box" style="display: none; position: absolute; top: 70px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; z-index: 61;">
             <!-- (Paste your existing memory match html here) -->
        </div>

        <!-- MAIN PROFILE SCREEN -->
        <div id="main-screen" style="display: none; width: 100%; max-width: 400px; text-align: center;">
            <div style="margin-bottom: 15px;">
                <img id="main-profile-img" src="default-profile.png" style="width: 120px; height: 120px; border-radius: 50%; border: 3px solid white; object-fit: cover; box-shadow: 0 0 15px rgba(0,0,0,0.6);">
                <h2 id="main-username" style="margin-top: 10px; text-shadow: 2px 2px 5px black;">@username</h2>
                <p id="main-bio" style="font-size: 12px; color: #ddd; margin-top: 3px;"></p>
            </div>

            <!-- Games Open Button -->
            <button id="main-open-games-btn" style="background: linear-gradient(135deg, #9b59b6, #8e44ad); width: 100%; border-radius: 12px; font-size: 14px; font-weight: bold; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4);">🎮 Games & 🪙 Coins</button>
            
            <div id="back-my-profile" style="margin-top: 15px; display: none;">
                <button onclick="window.location.href='index.html'" style="background: #333; font-size: 12px; width: auto; padding: 6px 15px; border-radius: 20px;">🏠 View My Profile</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/game.js"></script>
</body>
</html>
